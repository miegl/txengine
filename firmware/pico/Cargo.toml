[package]
name = "txengine-pico"
description = "txengine RF front end firmware for the Raspberry Pi RP2040 and RP2350"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Josef Miegl <josef@miegl.cz>"]
publish = false

# A workspace of its own: the firmware is built for bare-metal targets.
[workspace]

[features]
rp2040 = ["embassy-rp/rp2040", "embassy-rp/boot2-w25q080"]
rp2350 = ["embassy-rp/rp235xa", "embassy-rp/imagedef-secure-exe"]

[dependencies]
txengine-pico-protocol = { path = "../../crates/txengine-pico-protocol" }
embassy-rp = { version = "0.10", features = ["unstable-pac", "time-driver", "critical-section-impl"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-usb = { version = "0.6", default-features = false }
embassy-time = "0.5"
embassy-sync = "0.8"
embassy-futures = "0.1"
cortex-m = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
pio = "0.3"
static_cell = "2"
# Atomic read-modify-write for static_cell on the Cortex-M0+.
portable-atomic = { version = "1", features = ["critical-section"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2
panic = "abort"

[profile.dev]
opt-level = 2
panic = "abort"
